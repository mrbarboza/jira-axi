name: Open-source invariants

on:
  pull_request:
  push:
    branches: [main]

jobs:
  invariants:
    name: ADR-0001 invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No hardcoded host / cloudId / customfield ID, no Nubank vocabulary
        run: ./scripts/check-open-source-invariants.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
